name: P0 native daily gameplay validation
on:
  push:
    branches: [work/p0-strategic-gameplay-loop]
  pull_request:
    paths:
      - 'include/vic25/**'
      - 'tests/test_p0_daily.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/p0-daily-validation.yml'
  workflow_dispatch:

jobs:
  p0-daily:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure headless C++20
        run: cmake -S . -B build-p0 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DVIC25_ENABLE_GL=OFF
      - name: Compile native daily P0 and regressions
        run: cmake --build build-p0 --config Debug --parallel 2 --target vic25_p0_daily_tests vic25_daily_native_tests vic25_daily_time_tests vic25_phase_c_tests vic25_phase_d_tests vic25_phase_gh_tests
      - name: Execute P0 and baseline daily integration
        run: ctest --test-dir build-p0 -C Debug -R "^(vic25_p0_daily_tests|vic25_daily_native_tests|vic25_daily_time_tests|vic25_phase_c_tests|vic25_phase_d_tests|vic25_phase_gh_tests)$" --output-on-failure -V
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-daily-${{ matrix.os }}-diagnostics
          path: build-p0/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
