name: Phase G-H 238 individual acceptance gates
on:
  push:
    branches:
      - work/phase-gh-238-acceptance
  workflow_dispatch:

concurrency:
  group: phase-gh-238-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract_238:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: build/vic25_phase_gh_acceptance
          - os: windows-2022
            binary: build/Release/vic25_phase_gh_acceptance.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate the 238-spec manifest and exact C++ ID mappings
        run: python scripts/verify_phase_gh_238.py --root . --audit
      - name: CMake configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build focused acceptance executable
        run: cmake --build build --config Release --target vic25_phase_gh_acceptance --parallel 2
      - name: Per-ID original-spec PASS FAIL BLOCKED JSON report
        run: python scripts/verify_phase_gh_238.py --root . --binary "${{ matrix.binary }}" --report "build/gh-238-${{ matrix.os }}.json"
      - name: Build all C D E G H regression targets
        run: cmake --build build --config Release --parallel 2
      - name: Execute full CTest regression and 238 individually registered G/H IDs
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Upload per-case acceptance evidence even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-238-${{ matrix.os }}
          path: build/gh-238-${{ matrix.os }}.json
          if-no-files-found: warn
