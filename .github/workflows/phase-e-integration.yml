name: Phase E C-D-E integration and bounded E-V gates
on:
  push:
    branches:
      - work/phase-e-cpp-integration
      - work/phase-e-v-remaining
  workflow_dispatch:

concurrency:
  group: phase-e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa OpenGL test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglfw3-dev libglew-dev libgl1-mesa-dev xvfb
      - name: Configure C++20 with GL backend (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVIC25_ENABLE_GL=ON
      - name: Configure C++20 headless core (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVIC25_ENABLE_GL=OFF
      - name: Build C/D/E regression targets
        run: cmake --build build --config Release --parallel 2
      - name: Execute CTest suite
        run: ctest --test-dir build -C Release --output-on-failure -V
