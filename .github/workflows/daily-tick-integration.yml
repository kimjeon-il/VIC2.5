name: Daily Tick v2 — real ledgers and legacy migration
on:
  push:
    branches:
      - work/daily-tick-b-j
  workflow_dispatch:

concurrency:
  group: daily-tick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 (headless)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVIC25_ENABLE_GL=OFF
      - name: Build daily migration and engine tests
        run: cmake --build build --config Release --parallel 2 --target vic25_daily_time_tests
      - name: Daily real-ledger / Gregorian / restore / rollback
        run: ctest --test-dir build -C Release -R '^vic25_daily_time_tests$' -V --output-on-failure
      - name: Build existing B/C/D/E/GH regression targets
        run: cmake --build build --config Release --parallel 2 --target vic25_phase_b_tests vic25_phase_c_tests vic25_phase_d_tests vic25_phase_e_tests vic25_phase_gh_tests vic25_phase_gh_snapshot_tests
      - name: Execute existing B/C/D/E/GH regressions
        run: ctest --test-dir build -C Release -R '^(vic25_phase_b_tests|vic25_phase_c_tests|vic25_phase_d_tests|vic25_phase_e_tests|vic25_phase_gh_tests|vic25_phase_gh_snapshot_tests)$' --output-on-failure
