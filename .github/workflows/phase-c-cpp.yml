name: VIC2.5 Phase C C++ verification

on:
  push:
    branches:
      - work/phase-c-engine-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cpp:
    name: GCC C++20 build and CTest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
