name: VIC2.5 Phase C C++ verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++20 CTest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: CTest all registered executable suites
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Report 48-ID D4 subset statuses
        if: runner.os == 'Linux'
        run: ./build/vic25_phase_c_tests
      - name: Report 1200-month demographic/economic regression
        if: runner.os == 'Linux'
        run: ./build/vic25_phase_c_longrun
      - name: Benchmark 100k active POP slices with real cross-ledger trades
        if: runner.os == 'Linux'
        run: ./build/vic25_phase_c_scaling 100000
      - name: Benchmark 1M active POP slices with real cross-ledger trades
        if: runner.os == 'Linux'
        run: ./build/vic25_phase_c_scaling 1000000
