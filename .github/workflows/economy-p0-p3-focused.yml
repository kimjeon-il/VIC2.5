name: VIC2.5 economy P0-P3 focused smoke
on:
  push:
    branches: [work/economy-daily-p0-p3-20261115]
  workflow_dispatch:
jobs:
  focused-economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile one headless native economic scenario (no package install)
        run: g++ -std=c++20 -O0 -Iinclude tests/test_economy_native_smoke.cpp -o /tmp/vic25-economy-smoke
      - name: Check priority demand and real-funded new construction
        run: /tmp/vic25-economy-smoke
