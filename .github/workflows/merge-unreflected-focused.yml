name: VIC2.5 merge integration focused checks
on:
  push:
    branches:
      - work/merge-unreflected-20261119
  workflow_dispatch:
jobs:
  economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build economic save and founding smoke
        run: g++ -std=c++20 -O0 -Iinclude tests/test_economy_native_smoke.cpp -o /tmp/vic25-economy-smoke
      - name: Run economic save and founding smoke
        run: /tmp/vic25-economy-smoke
      - name: Build real freight and bank credit smoke
        run: g++ -std=c++20 -O0 -Iinclude tests/test_economy_transport_trade_credit_smoke.cpp -o /tmp/vic25-freight-smoke
      - name: Run real freight and bank credit smoke
        run: /tmp/vic25-freight-smoke
      - name: Validate historical line chronology
        run: python3 scripts/compile_historical_rail_lifetimes.py
